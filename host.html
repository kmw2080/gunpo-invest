<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>군포센터 투자 대회 · 진행자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;900&family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#0E1116; --panel:#161C24; --panel2:#1D242E; --line:#2A3441;
  --ink:#E9EDF2; --dim:#93A0B1; --faint:#5D6B7C;
  --up:#F04452; --down:#3182F6; --flat:#8B95A5;
  --amber:#F5C24C; --amberdim:#8A6E24; --ok:#37B679;
  --disp:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono","IBM Plex Sans KR",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
button{font-family:var(--body);cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}

.bar{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--ground);z-index:20;flex-wrap:wrap}
.brand{font-family:var(--disp);font-weight:900;font-size:19px;color:var(--amber)}
.brand span{color:var(--ink)}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:3px 8px}
.tag.live{color:var(--ok);border-color:rgba(55,182,121,.45)}
.tag.prac{color:var(--amber);border-color:var(--amberdim)}
.spacer{margin-left:auto}
.btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:7px;
  padding:9px 14px;font-size:14px;font-weight:600}
.btn:hover{background:#26303c}
.btn.pri{background:var(--amber);color:#171208;border-color:var(--amber);font-weight:700}
.btn.pri:hover{background:#ffd469}
.btn.grn{background:var(--ok);border-color:var(--ok);color:#04170D;font-weight:700}
.btn.red{background:transparent;color:var(--up);border-color:rgba(240,68,82,.45)}
.btn.red:hover{background:rgba(240,68,82,.12)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.32;cursor:not-allowed}
.timer{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--amber);min-width:78px;text-align:center}
.timer.hot{color:var(--up);animation:pl .8s infinite}
@keyframes pl{50%{opacity:.4}}

.main{display:grid;grid-template-columns:1fr 372px;gap:20px;padding:16px 18px 40px;max-width:1680px;margin:0 auto}
@media (max-width:1150px){.main{grid-template-columns:1fr}}

.eyebrow{font-family:var(--mono);font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
h1.t{font-family:var(--disp);font-weight:900;font-size:clamp(30px,4.6vw,62px);line-height:1.05;margin:0 0 12px;text-wrap:balance}
.lede{font-size:16px;line-height:1.7;color:var(--dim);max-width:64ch}
.lede b{color:var(--ink)}

/* 업종 보드 */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:9px;margin-top:14px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.sec h4{margin:0 0 8px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.sec h4 .avg{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:700}
.sec .cnt{font-family:var(--mono);font-size:10.5px;color:var(--faint);font-weight:400}
.srow{display:grid;grid-template-columns:20px 1fr 62px;align-items:center;gap:7px;padding:4px 0;
  font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;transition:background .3s;border-radius:4px}
.srow .L{font-family:var(--disp);font-weight:900;font-size:15px;color:var(--amber);text-align:center}
.srow .pz{text-align:right;font-weight:600}
.srow .cg{text-align:right;font-weight:700;font-size:12px}
.srow.fu{background:rgba(240,68,82,.16)} .srow.fd{background:rgba(49,130,246,.16)}

/* 뉴스 */
.yr{font-family:var(--disp);font-weight:900;font-size:clamp(70px,12vw,170px);line-height:.9;color:var(--amber)}
.news{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-direction:column;gap:11px;max-width:70ch}
.news li{background:var(--panel);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;
  padding:14px 17px;font-size:18px;line-height:1.5;display:flex;gap:13px}
.news li span.d{font-family:var(--mono);font-size:11px;color:var(--amberdim);padding-top:5px}

/* 라이브 패널 */
.live{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 14px}
.card h3{margin:0 0 10px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .n{margin-left:auto;color:var(--amber);font-size:13px}
.tabs{display:flex;gap:5px;margin-bottom:9px}
.tabs button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  border-radius:6px;padding:6px 0;font-size:12.5px;font-weight:600}
.tabs button.on{background:var(--amber);color:#171208;border-color:var(--amber)}
.rank{display:flex;flex-direction:column;gap:3px;max-height:340px;overflow-y:auto}
.rk{display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center;padding:5px 4px;
  font-size:13px;border-radius:5px}
.rk:nth-child(1){background:rgba(245,194,76,.1)}
.rk .i{font-family:var(--disp);font-weight:900;font-size:14px;color:var(--faint);text-align:center}
.rk:nth-child(1) .i{color:var(--amber)}
.rk .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rk .v{font-family:var(--mono);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.flow{display:flex;flex-direction:column;gap:5px;max-height:260px;overflow-y:auto}
.fl{display:grid;grid-template-columns:1fr 46px 60px;gap:8px;align-items:center;font-size:12.5px}
.fl .bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.fl .bf{height:100%;background:var(--amberdim)}
.fl .c{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:right}
.empty{color:var(--faint);font-size:12.5px;padding:6px 2px}

/* OX */
.oxq{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:12px}
.oxq .q{font-size:clamp(22px,3.4vw,40px);font-weight:800;line-height:1.4;text-wrap:balance}
.oxq .why{color:var(--dim);font-size:14.5px;margin-top:10px}
.oxbig{font-family:var(--disp);font-weight:900;font-size:clamp(60px,10vw,130px);color:var(--amber);line-height:1}
.stat{display:flex;gap:22px;margin-top:14px;flex-wrap:wrap}
.stat div{font-family:var(--mono);font-size:15px}
.stat b{font-size:26px;font-weight:700;display:block;margin-top:3px}
.picker{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
input[type=text],input[type=number]{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  border-radius:7px;padding:9px 12px;font-family:var(--mono);font-size:14px;width:92px;text-align:center}
.survivors{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sv{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 11px;font-size:13.5px;font-weight:600}
.sv.top{border-color:var(--amber);color:var(--amber)}
.hintrow{display:grid;grid-template-columns:34px 110px 1fr;gap:11px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:7px}
.hintrow .r{font-family:var(--disp);font-weight:900;font-size:17px;color:var(--amber);text-align:center}
.hintrow .n{font-weight:700}
.hintrow .h{font-size:14px;color:var(--dim);line-height:1.5}

/* 최종 */
.pod{display:grid;grid-template-columns:48px 1fr 1fr 150px 90px;gap:13px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 15px;margin-bottom:7px}
.pod.p1{border-color:var(--amber);background:linear-gradient(90deg,rgba(245,194,76,.11),var(--panel) 60%)}
.pod .i{font-family:var(--disp);font-weight:900;font-size:23px;text-align:center;color:var(--faint)}
.pod.p1 .i{color:var(--amber)}
.pod .nm{font-weight:700;font-size:17px}
.pod .bw{height:9px;background:var(--panel2);border-radius:5px;overflow:hidden}
.pod .bf{height:100%;background:linear-gradient(90deg,var(--amberdim),var(--amber));transition:width .9s}
.pod .v{font-family:var(--mono);font-size:17px;font-weight:700;text-align:right}
.pod .m{font-family:var(--mono);font-size:15px;font-weight:700;text-align:right}
.rv{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:9px;margin-top:16px}
.rvi{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px;
  display:grid;grid-template-columns:74px 1fr auto;gap:11px;align-items:center}
.rvi .c{font-family:var(--mono);font-size:12px;color:var(--amber)}
.rvi .n{font-weight:700;font-size:15.5px}
.rvi .m{font-family:var(--mono);font-size:15px;font-weight:700}

.admin{border-top:1px solid var(--line);margin-top:26px;padding-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.admin .lab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-right:4px}
.danger{margin-left:auto}
.kbd{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:14px}
.kbd b{color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.conn{background:var(--up);color:#fff;text-align:center;font-size:13px;padding:6px;display:none}
.conn.on{display:block}
</style>
</head>
<body>
<div class="conn" id="conn">서버 연결 끊김 — 재연결 중…</div>
<div class="bar">
  <div class="brand">군포센터 <span>투자 대회</span></div>
  <span class="tag" id="modeTag">준비</span>
  <span class="tag" id="stepTag">—</span>
  <span class="tag live" id="pcount">참가 0명</span>
  <div class="spacer"></div>
  <div class="timer" id="timer">2:00</div>
  <button class="btn" id="tBtn">타이머</button>
  <button class="btn" id="openBtn">매매 열기</button>
  <button class="btn" id="prev">← 이전</button>
  <button class="btn pri" id="next">다음 →</button>
</div>

<div class="main">
  <div id="stage"></div>
  <div class="live">
    <div class="card">
      <h3>실시간 순위 <span class="n" id="rkCount">0명</span></h3>
      <div class="tabs">
        <button data-tab="total" class="on">합계</button>
        <button data-tab="cash">현금</button>
        <button data-tab="stock">주식</button>
      </div>
      <div class="rank" id="rank"></div>
    </div>
    <div class="card">
      <h3>업종 쏠림</h3>
      <div class="flow" id="flow"></div>
    </div>
  </div>
</div>

<div class="main" style="padding-top:0">
  <div class="admin">
    <span class="lab">관리</span>
    <button class="btn grn" id="startMain">본게임 시작</button>
    <button class="btn" id="startRehearsal">리허설 시작</button>
    <button class="btn" id="toPractice">연습으로</button>
    <button class="btn" id="undo">라운드 되돌리기</button>
    <button class="btn" id="restore">백업에서 복구</button>
    <span class="danger"></span>
    <button class="btn red" id="wipe">전체 초기화</button>
  </div>
</div>

    if(mark){ s.push({t:'ox'}); s.push({t:'hint'}); }
  }
  s.push({t:'final'}); s.push({t:'unmask'});
  return s;
}

function yiOfStep(st){
  if(st.t==='trade') return st.yi;

function boardHTML(yi,prevYi,revealed){
  const S=stocksOf(MODE), bySec={};
  S.forEach(s=>{ (bySec[s.sector]=bySec[s.sector]||[]).push(s); });
  const held=holdCount();
  return `<div class="board">${Object.keys(bySec).map(sec=>{
    const list=bySec[sec];
    const chgs=list.map(s=>{ const cur=revealed?s.p[yi]:s.p[prevYi];
      const base=revealed? s.p[prevYi] : (prevYi>0? s.p[prevYi-1]:null);
      return base? cur/base-1 : null; });
    const valid=chgs.filter(c=>c!==null);
    const avg=valid.length? valid.reduce((a,b)=>a+b,0)/valid.length : null;
    const n=list.reduce((a,s)=>a+(held[s.id]||0),0);
    return `<div class="sec"><h4>${esc(sec)} <span class="cnt">${n?n+'명':''}</span>
      <span class="avg ${avg===null?'flat':avg>0.0005?'up':avg<-0.0005?'down':'flat'}">${avg===null?'':(avg>0?'+':'')+(avg*100).toFixed(0)+'%'}</span></h4>
      ${list.map((s,i)=>{ const cur=revealed?s.p[yi]:s.p[prevYi], c=chgs[i];
        const cl=c===null?'flat':c>0.0005?'up':c<-0.0005?'down':'flat';
        return `<div class="srow" data-row="${esc(s.id)}" data-dir="${c===null?0:c>0?1:c<0?-1:0}">
          <span class="L">${s.letter}</span><span class="pz">${won(cur)}</span>
          <span class="cg ${cl}">${c===null?'—':(c>0?'+':'')+(c*100).toFixed(0)+'%'}</span></div>`;
      }).join('')}</div>`;
  }).join('')}</div>`;
}

/* ── 순위 ── */
function priceNow(){ const st=STEPS[si]; return priceMap(MODE,yiOfStep(st)); }
function calc(p){ const pr=priceNow(), q=p.qty||{};
  const stock=Object.keys(q).reduce((a,k)=>a+(q[k]||0)*(pr[k]||0),0);
  return {cash:p.cash||0, stock, total:(p.cash||0)+stock}; }
function rank(kind){
  return Object.entries(players).filter(([k,p])=>p&&p.name)
    .map(([k,p])=>({k,name:p.name,...calc(p)}))
    .sort((a,b)=>b[kind]-a[kind]);
}
function holdCount(){ const m={};
  Object.values(players).forEach(p=>{ if(!p||!p.qty) return;
    Object.keys(p.qty).forEach(id=>{ if(p.qty[id]>0) m[id]=(m[id]||0)+1; }); });
  return m; }
function paintLive(){
  const R=rank(tab), n=Object.keys(players).length;
  $('#pcount').textContent='참가 '+n+'명'; $('#rkCount').textContent=n+'명';
  $('#rank').innerHTML = R.length? R.map((r,i)=>`<div class="rk"><span class="i">${i+1}</span>

    : '<div class="empty">아직 참가자가 없습니다</div>';
  const held=holdCount(), bySec={};
  stocksOf(MODE).forEach(s=>{ bySec[s.sector]=(bySec[s.sector]||0)+(held[s.id]||0); });
  const mx=Math.max(1,...Object.values(bySec));
  const rows=Object.entries(bySec).sort((a,b)=>b[1]-a[1]);
  $('#flow').innerHTML = rows.some(r=>r[1]>0)? rows.map(([s,c])=>`<div class="fl">
      <span>${esc(s)}</span><span class="bar"><span class="bf" style="width:${(c/mx*100).toFixed(0)}%"></span></span>
      <span class="c">${c}명</span></div>`).join('')
    : '<div class="empty">아직 아무도 매수하지 않았습니다</div>';
}

function podium(R){
  if(!R.length) return '';

  return R.map((r,i)=>{ const m=r.total/SEED;

  Object.keys(players).forEach(k=>{
    up['players/'+k+'/cash']=SEED; up['players/'+k+'/qty']={};
    up['players/'+k+'/hint']=null; up['players/'+k+'/alive']=true;
    up['players/'+k+'/oxA']=null; up['players/'+k+'/oxIdx']=null; up['players/'+k+'/oxT']=null;
  });
  return db.ref().update(up);
}
$('#startMain').onclick=()=>{
  if(!confirm('모든 참가자의 계좌를 1,000만으로 초기화하고 본게임 2005년으로 갑니다.\n참가자 명단은 그대로 유지됩니다.\n\n계속할까요?')) return;
  backup(); oxIdx=0; window.__ox=null;
  resetAccounts().then(()=>{ MODE='main'; STEPS=buildSteps('main'); si=0; commit(); });
};
$('#startRehearsal').onclick=()=>{
  if(!confirm('리허설을 시작합니다. 가상의 40종목·10라운드로 본게임과 똑같이 진행됩니다.\n모든 참가자의 계좌가 1,000만으로 초기화됩니다.\n\n계속할까요?')) return;
  backup(); oxIdx=0; window.__ox=null;
  resetAccounts().then(()=>{ MODE='rehearsal'; STEPS=buildSteps('rehearsal'); si=0; commit(); });
};
$('#toPractice').onclick=()=>{
  if(!confirm('연습게임으로 돌아갑니다. 계좌가 초기화됩니다.\n계속할까요?')) return;
  backup(); oxIdx=0; window.__ox=null;
  resetAccounts().then(()=>{ MODE='practice'; STEPS=buildSteps('practice'); si=0; commit(); });
};
$('#undo').onclick=()=>{
  if(si===0){ alert('첫 단계입니다.'); return; }
  if(!confirm('한 단계 되돌립니다. 주가와 자산이 직전 상태로 돌아갑니다.\n(이미 체결된 매매는 취소되지 않습니다)\n\n계속할까요?')) return;
  si--; commit();
};
$('#wipe').onclick=()=>{
  const n=Object.keys(players).length;
  if(!confirm(`참가자 ${n}명의 기록이 전부 삭제됩니다.\n되돌릴 수 없습니다.\n\n정말 진행할까요?`)) return;
  if(!confirm('한 번 더 확인합니다. 정말 전체 초기화할까요?')) return;
  backup();
  db.ref('players').remove().then(()=>{ MODE='practice'; STEPS=buildSteps('practice'); si=0;
    oxIdx=0; window.__ox=null; db.ref('state/ox').remove(); commit(); });
};
$('#restore').onclick=()=>{
  db.ref('backups').limitToLast(12).once('value').then(s=>{
    const v=s.val()||{}, ks=Object.keys(v).reverse();
    if(!ks.length){ alert('백업이 없습니다.'); return; }
    const list=ks.map((k,i)=>`${i+1}. ${new Date(v[k].at).toLocaleTimeString('ko-KR')} · ${v[k].label}`).join('\n');
    const pick=prompt('복구할 백업 번호를 입력하세요.\n\n'+list);
    const idx=parseInt(pick,10);
    if(!Number.isFinite(idx)||idx<1||idx>ks.length) return;
    const b=v[ks[idx-1]];
    db.ref('players').set(b.players||{}).then(()=>{
      MODE=b.mode||'practice'; STEPS=buildSteps(MODE); si=b.step||0; commit();
      alert('복구했습니다.');
    });
  });
};

/* ── 이동 ── */
function go(d){
  const from=STEPS[si];
  si=Math.min(STEPS.length-1,Math.max(0,si+d));
  const to=STEPS[si];
  if(to.t==='ox' && from.t!=='ox'){
    oxIdx = MODE==='practice'?0 : MODE==='rehearsal'?(nextHintYear()>5?15:0) : (nextHintYear()>2012?50:0);
    window.__ox=null; oxResetAll(); }
  if(from.t==='trade') db.ref('state/tradingOpen').set(false);
  if(to.t==='reveal') backup();
  commit();
}
$('#next').onclick=()=>go(1); $('#prev').onclick=()=>go(-1);
document.addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(e.code==='Space'){e.preventDefault();go(1);}
  else if(e.key==='ArrowRight')go(1);
  else if(e.key==='ArrowLeft')go(-1);
  else if(e.key.toLowerCase()==='t'){e.preventDefault();toggleTimer();}
  else if(e.key.toLowerCase()==='o'){e.preventDefault();$('#openBtn').click();}
  else if(e.key.toLowerCase()==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
});
document.addEventListener('click',e=>{
  const id=e.target.id;
  if(id==='oxGo') oxGo();
  else if(id==='oxShut') oxShut();
  else if(id==='oxMark') oxMark();
  else if(id==='oxReset'){ if(confirm('탈락자를 전원 부활시킬까요?')) oxResetAll(); }
  else if(id==='oxPrev'){ oxIdx=Math.max(0,oxIdx-1); window.__ox=null; render(); }
  else if(id==='oxNext'){ oxIdx=Math.min(oxBank().length-1,oxIdx+1); window.__ox=null; render(); }
  else if(id==='sendHint') sendHints();
  else if(id==='clearHint'){ clearHints(); alert('힌트를 회수했습니다.'); }
});
document.addEventListener('change',e=>{
  if(e.target.id==='oxJump'){ const v=parseInt(e.target.value,10);
    if(Number.isFinite(v)) oxIdx=Math.max(0,Math.min(oxBank().length-1,v-1));
    window.__ox=null; render(); }
});

commit();
</script>
</body>
</html>

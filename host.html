<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>진행자 화면 · 군포센터 투자 대회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;900&family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#0E1116; --panel:#161C24; --panel2:#1D242E; --line:#2A3441;
  --ink:#E9EDF2; --dim:#93A0B1; --faint:#5D6B7C;
  --up:#F04452; --down:#3182F6; --amber:#F5C24C; --amberdim:#8A6E24; --ok:#37B679;
  --disp:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono","IBM Plex Sans KR",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
button{font-family:var(--body);cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .amb{color:var(--amber)} .mut{color:var(--faint)}

.top{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--line);
  padding:11px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-family:var(--disp);font-weight:900;font-size:19px;margin:0}
.tag{font-family:var(--mono);font-size:11.5px;padding:4px 10px;border-radius:20px;
  background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.tag.hot{background:rgba(245,194,76,.12);border-color:var(--amberdim);color:var(--amber)}
.tag.ok{background:rgba(55,182,121,.12);border-color:var(--ok);color:var(--ok)}
.top .sp{margin-left:auto}

.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;
  padding:14px 18px 60px;max-width:1500px;margin:0 auto}
@media (max-width:1000px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:14px}
.card h2{font-family:var(--disp);font-weight:900;font-size:16px;margin:0 0 11px;
  display:flex;align-items:center;gap:9px}
.card h2 .c{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--faint);font-weight:400;margin-left:auto}

.btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:9px;
  padding:10px 15px;font-size:14px;font-weight:600}
.btn:hover:not(:disabled){background:#28313d}
.btn.pri{background:var(--amber);color:#171208;border-color:var(--amber);font-weight:700}
.btn.red{background:var(--up);border-color:var(--up);color:#fff}
.btn.grn{background:var(--ok);border-color:var(--ok);color:#04170D}
.btn.blue{background:var(--down);border-color:var(--down);color:#fff}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.big{padding:15px 22px;font-size:17px}
.btn:disabled{opacity:.3;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* 무대 */
.stage{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--amberdim);
  border-radius:14px;padding:20px;margin-bottom:14px}
.stage .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--amber)}
.stage .big{font-family:var(--disp);font-weight:900;font-size:34px;line-height:1.15;margin:8px 0 4px;text-wrap:balance}
.stage .sub{color:var(--dim);font-size:14.5px;line-height:1.6}
.stage .nav{display:flex;gap:9px;margin-top:16px;align-items:center;flex-wrap:wrap}
.prog{font-family:var(--mono);font-size:12px;color:var(--faint);margin-left:auto}

.nl{display:flex;gap:10px;background:var(--panel2);border-left:3px solid var(--line);
  border-radius:0 8px 8px 0;padding:11px 13px;margin-bottom:7px;font-size:14.5px;line-height:1.55}
.nl .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding-top:3px;flex:none;width:30px}
.nl.t{border-left-color:var(--ok)} .nl.t .k{color:var(--ok)}
.nl.m{border-left-color:var(--faint)} .nl.m .k{color:var(--faint)}
.nl.f{border-left-color:var(--up)} .nl.f .k{color:var(--up)}

/* 표 */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);font-weight:500;position:sticky;top:0;background:var(--panel)}
tbody tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right;font-family:var(--mono)}
tr.win td{background:rgba(245,194,76,.07)}
tr.dead td{opacity:.4}
.rk{font-family:var(--disp);font-weight:900;color:var(--amber);width:26px}
.scroll{max-height:760px;overflow-y:auto}

.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:8px 0;font-size:13px;font-weight:600;border-radius:8px;
  background:var(--panel2);border:1px solid var(--line);color:var(--faint)}
.tabs button.on{border-color:var(--amber);color:var(--amber);background:rgba(245,194,76,.1)}

.crowd{display:flex;flex-direction:column;gap:5px}
.cw{display:grid;grid-template-columns:110px 1fr 42px;gap:9px;align-items:center;font-size:12.5px}
.cw .bar{height:9px;background:var(--panel2);border-radius:5px;overflow:hidden}
.cw .bar i{display:block;height:100%;background:var(--amber);border-radius:5px}
.cw .n{font-family:var(--mono);text-align:right;color:var(--dim)}

/* 미니게임 */
.mgmenu{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.mgb{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 12px;
  text-align:left;color:inherit}
.mgb:hover{border-color:var(--amber)}
.mgb .t{font-weight:700;font-size:14.5px}
.mgb .u{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:4px}
.live{background:var(--panel2);border:1px solid var(--amberdim);border-radius:11px;padding:14px;margin-bottom:12px}
.live .hh{font-family:var(--disp);font-weight:900;font-size:20px;margin-bottom:4px}
.live .ss{color:var(--dim);font-size:13.5px;margin-bottom:12px;line-height:1.6}
.ordgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.ordbox{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--panel2)}
.ordbox .n{font-size:26px;font-weight:700;line-height:1.1}
.ordbox .l{font-size:12.5px;color:var(--faint);margin-top:3px}
.ordbox.done{border-color:#2E7D52} .ordbox.done .n{color:#4ADE80}
.ordbox.wait{border-color:#8A3038} .ordbox.wait .n{color:#F87171}
.namewrap{max-height:260px;overflow-y:auto}
.namegrp{margin-bottom:10px}
.namegrp>.h{font-size:12.5px;color:var(--faint);margin-bottom:6px;letter-spacing:.04em}
.names{display:flex;flex-wrap:wrap;gap:6px}
.nchip{border-radius:7px;padding:6px 10px;font-size:14px;font-weight:600;
  border:1px solid var(--line);background:var(--panel)}
.nchip.none{border-color:#8A3038;background:#2A1416;color:#FCA5A5}
.nchip.hold{border-color:var(--line);color:var(--faint)}
.bars{display:flex;flex-direction:column;gap:6px;max-height:470px;overflow-y:auto}
.bl{display:grid;grid-template-columns:100px 1fr 62px;gap:9px;align-items:center;font-size:13px}
.bl .bar{height:15px;background:var(--panel);border-radius:4px;overflow:hidden}
.bl .bar i{display:block;height:100%;background:var(--amber)}
.bl .v{font-family:var(--mono);text-align:right;font-weight:700}
.bl.out .v{color:var(--up)} .bl.out .bar i{background:var(--up)}
.bl.top .v{color:var(--amber)}
.numgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:10px 0}
.numgrid div{text-align:center;padding:8px 0;border-radius:7px;background:var(--panel);
  border:1px solid var(--line);font-family:var(--mono);font-size:13px}
.numgrid div b{display:block;font-family:var(--disp);font-size:15px;color:var(--amber)}
.numgrid div.hit{border-color:var(--amber);background:rgba(245,194,76,.14)}
.buzz{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.bz{display:grid;grid-template-columns:26px 1fr auto auto;gap:9px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:13.5px}
.bz .o{font-family:var(--disp);font-weight:900;color:var(--amber)}
.bz.first{border-color:var(--amber)}
.bz.wrong{opacity:.45}

.warn{border-left:3px solid var(--up);background:var(--panel2);border-radius:0 9px 9px 0;
  padding:11px 14px;font-size:13.5px;color:var(--dim);line-height:1.6;margin-top:10px}
.warn b{color:var(--ink)}
input[type=text],input[type=number],select{background:var(--panel2);border:1px solid var(--line);
  color:var(--ink);border-radius:8px;padding:9px 11px;font-family:var(--body);font-size:14px}
input[type=number]{font-family:var(--mono);width:130px}
select{min-width:150px}
.foot{padding:0 18px 40px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--faint)}
.hidden{display:none!important}
</style>
</head>

  return {stocks:D.stocks, years:D.years, news:D.news, recap:D.recap,
    hints:D.hints, ox:D.ox, sectors:D.sectors};
}
const MD=()=>modeData(MODE);
const N=()=>MD().years.length-1;                 // 라운드 수
function steps(){
  const out=[{t:'open'},{t:'brief'}];
  const last = ENDAT? Math.min(ENDAT, N()) : N();
  for(let k=1;k<=last;k++){ out.push({t:'news',k},{t:'trade',k},{t:'reveal',k}); }
  out.push({t:'unmask'},{t:'final'});
  return out;
}
const CUR=()=>steps()[Math.min(SI, steps().length-1)];
function priceIdx(st){
  if(st.t==='news'||st.t==='trade') return st.k-1;
  if(st.t==='reveal') return st.k;
  if(st.t==='open'||st.t==='brief') return 0;
  return ENDAT? Math.min(ENDAT,N()) : N();
}
function pricesAt(i){ const o={}; MD().stocks.forEach(s=>o[s.id]=s.p[Math.max(0,Math.min(i,s.p.length-1))]); return o; }
const yearLabel=k=>String(MD().years[k]);
const roundOf=()=>{ const c=CUR(); return c.k||0; };

/* ═══ 서버로 밀기 ═══ */
function secChg(k, sector){
  const md=MD(), L=md.stocks.filter(s=>s.sector===sector);
  if(!L.length) return null;
  return L.reduce((a,s)=>a+(s.p[k]/s.p[k-1]-1),0)/L.length;
}
function buildRecap(k){
  const md=MD(), y=String(md.years[k]);
  const B=(D.back&&D.back[y]);
  if(!B || MODE==='rehearsal' || MODE==='practice')
    return md.recap[y]? [{k:'m', m:md.recap[y]}] : null;
  const out=[];
  ['t','f'].forEach(kk=>{
    const b=B[kk], v=secChg(k, b.s);
    if(v===null) return;
    out.push({k:kk, n:b.n, s:b.s, v:Math.round(v*100), m:b.m});
  });
  return out.length? out : null;
}
function pushState(){
  const st=CUR(), i=priceIdx(st), md=MD();
  const phase = st.t==='news'?'news' : st.t==='trade'?'trade' : st.t==='reveal'?'reveal'
              : st.t==='unmask'?'unmask' : st.t==='final'?'final' : 'lobby';
  const yk = st.k || (st.t==='final'||st.t==='unmask' ? (ENDAT?Math.min(ENDAT,N()):N()) : 0);
  const out={
    phase: MINI? 'mini' : phase,
    mode: MODE, ri: i,
    round: yk, totalRounds: (ENDAT? Math.min(ENDAT,N()) : N()),
    yearLabel: yk? yk+'라운드' : '',
    tradingOpen: false,
    seedCash: D.seedCash, loanRate: D.loanRate,
    labels: md.stocks.map(s=>({id:s.id,sector:s.sector,letter:s.letter})),
    prices: pricesAt(i), prevPrices: pricesAt(i-1),
    history:(()=>{ const m={}; md.stocks.forEach(s=>{ m[s.id]=s.p.slice(0,i+1); }); return m; })(),
    yearLabels: Array.from({length:i+1},(_,x)=>x? x+'R' : '출발'),
    news: st.t==='news' ? (md.news[String(md.years[st.k])]||null) : null,
    recap: st.t==='reveal' ? buildRecap(st.k) : null,
    unmask: st.t==='unmask' ? md.stocks.map(s=>({sector:s.sector,letter:s.letter,real:s.real,
        m:s.p[priceIdx(st)]/D.startPrice})).sort((a,b)=>b.m-a.m) : null,
    mini: MINI,
  };
  if(st.t==='trade' && tradeOpen) out.tradingOpen=true;
  db.ref('state').set(out);
}
let tradeOpen=false;
function commit(){ pushState(); render(); }

/* ═══ 계산 ═══ */
function rows(){
  const p=pricesAt(priceIdx(CUR()));
  return Object.keys(PLAYERS).map(uid=>{
    const q=PLAYERS[uid], qty=q.qty||{};
    const sv=Object.keys(qty).reduce((a,k)=>a+(qty[k]||0)*(p[k]||0),0);
    const L=q.loans? (Array.isArray(q.loans)?q.loans:Object.keys(q.loans).map(k=>q.loans[k])) : [];
    const ri=priceIdx(CUR());
    const due=L.reduce((a,l)=>a+((l&&l.amt)||0)*Math.pow(1+D.loanRate, Math.max(0,ri-((l&&l.ri)||0))),0);
    return {uid, name:q.name||'—', cash:q.cash||0, stock:sv, total:(q.cash||0)+sv,
            due, net:(q.cash||0)+sv-due, alive:q.alive!==false, hint:q.hint||'',
            mini:q.mini||{}, loans:L};
  });
}
function crowd(){
  const m={}; MD().sectors.forEach(s=>m[s]=0);
  Object.keys(PLAYERS).forEach(uid=>{
    const qty=(PLAYERS[uid].qty)||{};
    MD().sectors.forEach(sec=>{ if(MD().stocks.some(s=>s.sector===sec&&(qty[s.id]||0)>0)) m[sec]++; });
  });
  return m;
}

}
function stepName(st){
  return {open:'오프닝',brief:'브리핑',news:'뉴스',trade:'매매',reveal:'주가 공개',
          unmask:'정체 공개',final:'최종 결산'}[st.t]+(st.k?' · '+yearLabel(st.k):'');
}

function drawStage(st,all){

    sub=`참가자에게 접속 주소를 안내하세요. 지금 <b>${Object.keys(PLAYERS).length}</b>${MODE==='team'?'팀':'명'} 들어와 있습니다.`; }

    sub=`${md.sectors.length}개 업종 · 시드머니 1,000만 · ${N()}라운드.<br>회사 이름은 끝까지 비밀입니다.`; }
  else if(st.t==='news'){
    big=`${yearLabel(st.k)}년 뉴스`;
    const lines=md.news[String(md.years[st.k])]||[];

    sub='아래 세 줄이 참가자 폰에 떴습니다. 소리 내어 읽어주세요.';
    extra=lines.map((n,i)=>`<div class="nl ${MODE==='rehearsal'?'m':ord[i]}">
      <span class="k">${MODE==='rehearsal'?'0'+(i+1):LB[ord[i]]}</span><span>${esc(n)}</span></div>`).join('');
  }
  else if(st.t==='trade'){ big=`${yearLabel(st.k)}년 매매`;
    sub=tradeOpen? '매매 <b class="amb">열림</b> — 2분 정도가 적당합니다.' : '아직 닫혀 있습니다. 아래 버튼으로 여세요.'; }
  else if(st.t==='reveal'){
    big=`${yearLabel(st.k)}년 결과`;
    const p=pricesAt(st.k), v=pricesAt(st.k-1);
    const bySec={}; md.sectors.forEach(s=>{ const L=md.stocks.filter(x=>x.sector===s);
      bySec[s]=L.reduce((a,x)=>a+(p[x.id]/v[x.id]-1),0)/L.length; });
    const so=Object.keys(bySec).sort((a,b)=>bySec[b]-bySec[a]);
    sub=`1등 <b class="amb">${esc(so[0])} ${(bySec[so[0]]*100).toFixed(0)}%</b> ·
         꼴찌 <b>${esc(so[so.length-1])} ${(bySec[so[so.length-1]]*100).toFixed(0)}%</b>`;
    const rc=buildRecap(st.k)||[];
    extra=rc.map(r=>`<div class="nl ${r.k}"><span class="k">${r.k==='t'?'진짜':r.k==='f'?'함정':'해설'}</span><span>${
      r.n? `<b>${r.n}번</b>이 ${r.k==='t'?'진짜였습니다':'함정이었습니다'} — ${esc(r.s)}
        <b class="${r.v>=0?'up':'down'}">${r.v>0?'+':''}${r.v}%</b><br><span class="mut">${esc(r.m)}</span>`
        : esc(r.m)}</span></div>`).join('');
  }
  else if(st.t==='unmask'){ big='봉인 해제';
    sub=`${md.stocks.length}개 종목의 정체가 참가자 폰에 공개됐습니다.`; }
  else if(st.t==='final'){ const r=rows().sort((a,b)=>b.net-a.net);
    big='최종 결산'; sub=r.length? `1위 <b class="amb">${esc(r[0].name)}</b> ${won(r[0].net)}` : '참가자가 없습니다'; }

  const isTrade=st.t==='trade';
  e.innerHTML=`<div class="lbl">STEP ${SI+1} / ${all.length}</div>
    <div class="big">${big}</div><div class="sub">${sub}</div>
    ${extra?`<div style="margin-top:14px">${extra}</div>`:''}
    <div class="nav">
      <button class="btn" id="prev" ${SI<=0?'disabled':''}>← 이전</button>
      <button class="btn pri big" id="next" ${SI>=all.length-1?'disabled':''}>다음 →</button>
      ${isTrade? `<button class="btn ${tradeOpen?'red':'grn'}" id="tg">${tradeOpen?'매매 마감':'매매 열기'}</button>`:''}
      <span class="prog">${st.k? '라운드 '+st.k+' / '+(ENDAT?Math.min(ENDAT,N()):N()) : ''}</span>
    </div>`;
  $('#prev').onclick=()=>{ if(SI>0){ SI--; tradeOpen=false; commit(); } };
  $('#next').onclick=()=>{ if(SI<all.length-1){ SI++; tradeOpen=false; if(steps()[SI].t==='reveal') clearHints(); commit(); } };
  const tg=$('#tg'); if(tg) tg.onclick=()=>{ tradeOpen=!tradeOpen; commit(); };
}

function drawOrder(st){
  const e=$('#orderCard');

        <button class="btn" id="gNextR">다음 차</button>
        <button class="btn" id="mgRevive">전원 부활</button>
        <button class="btn" id="mgEnd">미니게임 종료</button></div>`;
  }
  if(k==='tap'){
    const got=R.filter(r=>r.mini.taps!=null).sort((a,b)=>b.mini.taps-a.mini.taps);
    const mx=got.length?Math.max(1,got[0].mini.taps):1;
    return `<div class="live"><div class="hh">${MINI.stage==='intro'?'준비':'10초 연타'}</div>
      <div class="ss">폰 하나에 몇 명이 붙어도 됩니다</div>
      <div class="bars">${got.length? got.map((r,i)=>`<div class="bl ${i===0?'top':''}">
        <span>${esc(r.name)}</span><span class="bar"><i style="width:${(r.mini.taps/mx*100).toFixed(0)}%"></i></span>
        <span class="v">${r.mini.taps}</span></div>`).join('')
        : '<div class="mut" style="padding:10px">시작하면 여기에 막대가 자랍니다</div>'}</div></div>
      <div class="row">
        ${MINI.stage==='intro'? '<button class="btn pri big" id="tapGo">시작!</button>'
          : '<button class="btn" id="mgReset">다시</button>'}
        <button class="btn blue" id="tapWin" ${!got.length?'disabled':''}>1위 확정 · 결과 공개</button>
        <button class="btn" id="mgEnd">미니게임 종료</button></div>`;
  }
  return '';
}

function bindMgPanel(){
  const on=(id,fn)=>{ const e=$('#'+id); if(e) e.onclick=fn; };
  on('mgEnd',endMini);
  on('mgRevive',reviveAll);
  on('mgReset',()=>{ MINI.seq=Date.now(); MINI.stage='intro'; MINI.winner=null; MINI.answer=null;
    clearPlayerMini(); commit(); });
  on('mgOpen',()=>{ MINI.stage='open'; commit(); });
  /* 역재생 */
  on('mgShow',()=>{ MINI.stage='result'; MINI.answer=MGANS; commit(); });
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{
    const r=rows().find(x=>x.uid===b.dataset.ok);
    MINI.winner=r?r.name:''; MINI.stage='result'; MINI.answer=MGANS;
    sendHint(b.dataset.ok); commit(); });
  document.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>{
    db.ref('players/'+b.dataset.no+'/mini/buzz').remove(); });
  /* OX */
  on('oxNext',()=>{ const bank=MD().ox; MINI.qi=((MINI.qi==null?-1:MINI.qi)+1)%bank.length;
    const q=bank[MINI.qi]; MINI.q={q:q.q,a:q.a,why:q.why}; MINI.stage='intro';
    MINI.answer=null; MINI.seq=Date.now(); clearPlayerMini(); commit(); });
  on('oxOpen',()=>{ MINI.stage='open'; commit(); });
  on('oxShut',()=>{ MINI.stage='closed'; commit(); });
  on('oxMark',()=>{
    MINI.stage='result'; MINI.answer=MINI.q.a; MINI.why=MINI.q.why;
    const u={};
    rows().forEach(r=>{ if(r.alive && r.mini.ox!==MINI.q.a) u[r.uid+'/alive']=false; });
    if(Object.keys(u).length) db.ref('players').update(u);
    commit(); });
  /* 늦게 누르기 */
  on('lateGo',()=>{ MINI.stage='open'; MINI.seq=Date.now(); clearPlayerMini(); commit(); });
  on('lateWin',()=>{ const ok=rows().filter(r=>r.mini.ms>=0).sort((a,b)=>b.mini.ms-a.mini.ms);
    if(!ok.length) return; MINI.stage='result'; MINI.winner=ok[0].name; sendHint(ok[0].uid); commit(); });
  /* 숫자 맞추기 */
  on('gOpen',()=>{ MINI.answer=parseInt($('#gNum').value,10); MINI.stage='open';
    MINI.seq=Date.now(); clearPlayerMini(); commit(); });
  on('gShut',()=>{ MINI.stage='closed'; commit(); });
  on('gMark',()=>{
    MINI.stage='result';
    const al=rows().filter(r=>r.alive);
    const hit=al.filter(r=>r.mini.pick===MINI.answer);
    if(hit.length===0){ MINI.note='아무도 못 맞췄습니다 — 탈락 없이 다시!'; }
    else if(hit.length===1){ MINI.note=hit[0].name+' 우승!'; MINI.winner=hit[0].name;
      const u={}; al.forEach(r=>{ if(r.uid!==hit[0].uid) u[r.uid+'/alive']=false; });
      db.ref('players').update(u); sendHint(hit[0].uid); }
    else { MINI.note=hit.length+'명 생존 — 계속합니다';
      const u={}; al.forEach(r=>{ if(!hit.some(h=>h.uid===r.uid)) u[r.uid+'/alive']=false; });
      db.ref('players').update(u); }
    commit(); });
  on('gNextR',()=>{ MINI.round=(MINI.round||1)+1; MINI.stage='intro'; MINI.answer=null;
    MINI.note=''; MINI.seq=Date.now(); clearPlayerMini(); commit(); });
  /* 연타 */
  on('tapGo',()=>{ MINI.stage='open'; MINI.seq=Date.now(); clearPlayerMini(); commit();
    setTimeout(()=>{ if(MINI&&MINI.kind==='tap'&&MINI.stage==='open'){ MINI.stage='closed'; commit(); } },11500); });
  on('tapWin',()=>{ const g=rows().filter(r=>r.mini.taps!=null).sort((a,b)=>b.mini.taps-a.mini.taps);
    if(!g.length) return; MINI.stage='result'; MINI.winner=g[0].name; sendHint(g[0].uid); commit(); });
}

function sendHint(uid){
  const st=CUR();
  if(st.t!=='reveal') return;
  const nk=st.k+1, last=ENDAT?Math.min(ENDAT,N()):N();
  if(nk>last) return;
  const txt=hintText(nk);
  if(txt) db.ref('players/'+uid+'/hint').set(`다음 라운드 — ${txt}`);
}

/* ═══ 대출 ═══ */
function drawLoan(){
  const R=rows().sort((a,b)=>a.total-b.total);
  const e=$('#loanCard');
  e.innerHTML=`<h2>대출 <span class="c">연 ${(D.loanRate*100).toFixed(1)}% · 복리</span></h2>
    <div class="row">
      <select id="lnWho">${R.map(r=>`<option value="${r.uid}">${esc(r.name)} · ${won(r.total)}${r.due?' (빚 '+won(r.due)+')':''}</option>`).join('')}</select>
      <input type="number" id="lnAmt" value="5000000" step="1000000" min="0">
      <button class="btn pri" id="lnGo">대출 실행</button>
      <button class="btn sm" id="lnClear">전원 대출 삭제</button>
    </div>
    ${R.filter(r=>r.loans.length).length? `<div class="tw" style="margin-top:11px"><table>
      <thead><tr><th>이름</th><th class="n">원금</th><th class="n">상환 예정</th><th class="n">순자산</th></tr></thead>
      <tbody>${R.filter(r=>r.loans.length).map(r=>`<tr>
        <td>${esc(r.name)}</td><td class="n">${won(r.loans.reduce((a,l)=>a+l.amt,0))}</td>
        <td class="n up">${won(r.due)}</td><td class="n">${won(r.net)}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="warn">아직 대출한 ${MODE==='team'?'팀':'사람'}이 없습니다.
         자산이 시드의 30%(300만) 밑으로 떨어진 쪽에만 주시길 권합니다.</div>`}`;
  $('#lnGo').onclick=()=>{
    const uid=$('#lnWho').value, amt=parseInt($('#lnAmt').value,10);
    if(!uid||!Number.isFinite(amt)||amt<=0) return;
    const cur=(PLAYERS[uid].loans)||[];
    const arr=Array.isArray(cur)?cur.slice():Object.keys(cur).map(k=>cur[k]);
    const tot=arr.reduce((a,l)=>a+((l&&l.amt)||0),0);
    if(tot+amt>D.seedCash && !confirm('누적 대출이 시드머니(1,000만)를 넘습니다. 그래도 진행할까요?')) return;
    arr.push({amt, ri:priceIdx(CUR())});
    db.ref('players/'+uid).update({loans:arr, cash:(PLAYERS[uid].cash||0)+amt});
  };
  $('#lnClear').onclick=()=>{ if(!confirm('모든 대출 기록을 지웁니다. 현금은 그대로입니다.')) return;
    const u={}; Object.keys(PLAYERS).forEach(uid=>{ u[uid+'/loans']=null; }); db.ref('players').update(u); };
}

/* ═══ 순위 ═══ */
function drawRank(){
  const key=RANKTAB;
  const R=rows().sort((a,b)=>b[key]-a[key]);
  const showDue=R.some(r=>r.due>0);
  $('#rankCard').innerHTML=`<h2>순위 <span class="c">${R.length}${MODE==='team'?'팀':'명'}</span></h2>
    <div class="tabs">
      <button data-tab="total" class="${key==='total'?'on':''}">합계</button>
      <button data-tab="cash" class="${key==='cash'?'on':''}">현금</button>
      <button data-tab="stock" class="${key==='stock'?'on':''}">주식</button>
      ${showDue?`<button data-tab="net" class="${key==='net'?'on':''}">순자산</button>`:''}
    </div>
    <div class="tw scroll"><table>
      <thead><tr><th>#</th><th>이름</th><th class="n">현금</th><th class="n">주식</th>
        <th class="n">합계</th>${showDue?'<th class="n">순자산</th>':''}</tr></thead>
      <tbody>${R.map((r,i)=>`<tr class="${i===0?'win':''} ${r.alive?'':'dead'}">
        <td class="rk">${i+1}</td><td>${esc(r.name)}${r.hint?' 🔒':''}</td>
        <td class="n">${won(r.cash)}</td><td class="n">${won(r.stock)}</td>
        <td class="n"><b>${won(r.total)}</b></td>${showDue?`<td class="n ${r.due?'up':''}">${won(r.net)}</td>`:''}</tr>`).join('')
        || '<tr><td colspan="6" class="mut">아직 아무도 없습니다</td></tr>'}</tbody></table></div>`;
  $('#rankCard').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ RANKTAB=b.dataset.tab; drawRank(); });
}

function drawCrowd(){
  const c=crowd(), n=Object.keys(PLAYERS).length||1;
  const so=Object.keys(c).sort((a,b)=>c[b]-c[a]);
  $('#crowdCard').innerHTML=`<h2>업종 쏠림 <span class="c">진행자만 보입니다</span></h2>
    <div class="crowd">${so.map(s=>`<div class="cw"><span>${esc(s)}</span>
      <span class="bar"><i style="width:${(c[s]/n*100).toFixed(0)}%"></i></span>
      <span class="n">${c[s]}</span></div>`).join('')}</div>
    ${so[0]&&c[so[0]]>=Math.max(2,n*0.35)? `<div class="warn">지금 <b>${esc(so[0])}</b>에
      <b>${c[so[0]]}${MODE==='team'?'팀':'명'}</b>이 몰려 있습니다. 한 마디 던지기 좋은 타이밍이에요.</div>`:''}`;
}

/* ═══ 관리 ═══ */
function drawAdmin(){
  const last=ENDAT?Math.min(ENDAT,N()):N();
  $('#adminCard').innerHTML=`<h2>진행 관리</h2>
    <div class="row" style="margin-bottom:10px">
      <button class="btn" data-mode="practice">연습</button>
      <button class="btn" data-mode="rehearsal">리허설</button>
      <button class="btn pri" data-mode="solo">개인전 시작</button>
      <button class="btn pri" data-mode="team">팀전 시작</button>
    </div>
    <div class="row" style="margin-bottom:10px">
      <span class="mut">마지막 라운드</span>
      <select id="endAt"><option value="">끝까지 (${N()}라운드)</option>
        ${Array.from({length:N()},(_,i)=>i+1).filter(k=>k>=3).map(k=>
          `<option value="${k}" ${ENDAT===k?'selected':''}>${k}라운드 (${yearLabel(k)}년)까지</option>`).join('')}</select>
      <button class="btn" id="endGo">적용</button>
    </div>
    <div class="row">
      <button class="btn sm" id="bk">백업</button>
      <button class="btn sm" id="rs">복구</button>
      <button class="btn sm" id="rev">전원 부활</button>
      <button class="btn sm red" id="reset">전체 초기화</button>
    </div>
    <div class="warn">지금 <b>${last}라운드(${yearLabel(last)}년)</b>까지 진행합니다.
      중간에 끊으면 정체 공개 배수도 그 시점 기준으로 계산됩니다.</div>`;
  $('#adminCard').querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
    const m=b.dataset.mode;
    if(!confirm(({practice:'연습',rehearsal:'리허설',solo:'개인전',team:'팀전'})[m]+
       '으로 전환합니다. 모든 계좌가 초기화됩니다.')) return;
    MODE=m; SI=0; MINI=null; ENDAT=null; MGUSED={}; tradeOpen=false;
    resetAccounts(); commit();
  });
  $('#endGo').onclick=()=>{ const v=$('#endAt').value; ENDAT=v?parseInt(v,10):null;
    SI=Math.min(SI, steps().length-1); commit(); };
  $('#bk').onclick=()=>db.ref('backups').push({at:Date.now(),mode:MODE,si:SI,endAt:ENDAT,
    players:PLAYERS}).then(()=>alert('백업했습니다'));
  $('#rs').onclick=()=>db.ref('backups').limitToLast(1).once('value').then(s=>{
    const v=s.val(); if(!v) return alert('백업이 없습니다');
    const b=v[Object.keys(v)[0]];
    if(!confirm(new Date(b.at).toLocaleTimeString('ko-KR')+' 시점으로 되돌립니다.')) return;
    MODE=b.mode; SI=b.si; ENDAT=b.endAt||null;
    db.ref('players').set(b.players||{}).then(commit); });
  $('#rev').onclick=reviveAll;
  $('#reset').onclick=()=>{ if(!confirm('참가자 전원과 모든 기록을 지웁니다. 되돌릴 수 없습니다.')) return;
    db.ref('players').remove(); MINI=null; SI=0; ENDAT=null; MGUSED={}; commit(); };
}

function resetAccounts(){
  const u={};
  Object.keys(PLAYERS).forEach(uid=>{
    u[uid+'/cash']=D.seedCash; u[uid+'/qty']=null; u[uid+'/cost']=null;
    u[uid+'/hint']=null; u[uid+'/alive']=true; u[uid+'/mini']=null; u[uid+'/loans']=null;
  });
  if(Object.keys(u).length) db.ref('players').update(u);
}

/* ═══ 시작 ═══ */
db.ref('players').on('value',s=>{ PLAYERS=s.val()||{}; render(); });
commit();
setInterval(()=>{ if(MINI&&(MINI.kind==='tap'||MINI.kind==='late')&&MINI.stage==='open') render(); },700);
</script>

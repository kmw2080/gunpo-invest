<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<meta name="robots" content="noindex">
<title>군포센터 투자 대회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;900&family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#0E1116; --panel:#161C24; --panel2:#1D242E; --line:#2A3441;
  --ink:#E9EDF2; --dim:#93A0B1; --faint:#5D6B7C;
  --up:#F04452; --down:#3182F6; --flat:#8B95A5;
  --amber:#F5C24C; --amberdim:#8A6E24; --ok:#37B679;
  --disp:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono","IBM Plex Sans KR",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
button{font-family:var(--body);cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
.wrap{max-width:560px;margin:0 auto;padding:12px 13px 40px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}

/* ── 진입 화면 ── */
.enter{padding-top:7vh}
.kick{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber)}
.enter h1{font-family:var(--disp);font-weight:900;font-size:clamp(32px,9vw,46px);line-height:1.1;margin:10px 0 14px;text-wrap:balance}
.enter p{color:var(--dim);line-height:1.7;font-size:15px;margin:0 0 22px}
.field{display:flex;gap:8px}
input[type=text],input[type=tel]{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);
  color:var(--ink);border-radius:9px;padding:14px;font-family:var(--body);font-size:16px}
input[type=tel]{font-family:var(--mono);text-align:center}
.btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:9px;
  padding:13px 17px;font-size:15px;font-weight:600}
.btn:active{background:#2b3542}
.btn.pri{background:var(--amber);color:#171208;border-color:var(--amber);font-weight:700}
.btn.wide{width:100%;padding:15px;font-size:16px}
.btn:disabled{opacity:.35}

/* ── 규칙 ── */
.rules h2{font-family:var(--disp);font-weight:900;font-size:26px;margin:0 0 16px}
.rules .blk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px 17px;margin-bottom:10px}
.rules .blk b{color:var(--amber)}
.rules .blk p{margin:0;color:var(--dim);font-size:15px;line-height:1.7}
.rules .blk p+p{margin-top:8px}
.rules ul{margin:8px 0 0;padding-left:18px;color:var(--dim);font-size:14.5px;line-height:1.8}

/* ── 헤더 ── */
.hd{position:sticky;top:0;z-index:8;background:var(--ground);padding:10px 0 11px;
  border-bottom:1px solid var(--line);margin-bottom:12px}
.hd .r1{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.hd .nm{font-family:var(--disp);font-weight:900;font-size:17px;color:var(--amber);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .yr{margin-left:auto;flex:none;font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.08em}
.assets{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;font-family:var(--mono);
  font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.assets div{display:flex;justify-content:space-between}
.assets b{color:var(--ink);font-weight:600}
.assets .tot{grid-column:1/-1;border-top:1px solid var(--line);margin-top:5px;padding-top:6px;font-size:17px}
.assets .tot b{font-size:22px;font-weight:700}

/* ── 힌트 ── */
.hint{background:linear-gradient(180deg,rgba(245,194,76,.14),rgba(245,194,76,.05));
  border:1px solid var(--amberdim);border-radius:11px;padding:14px 16px;margin-bottom:12px}
.hint .t{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--amber);margin-bottom:6px}
.hint .b{font-size:16.5px;line-height:1.6;font-weight:600}
.hint .s{font-size:12px;color:var(--faint);margin-top:7px}

/* ── 업종 그리드 ── */
.minih{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.minih.empty2{display:block;color:var(--faint);font-size:12.5px;padding:2px 0 4px}
.chip{background:rgba(245,194,76,.1);border:1px solid var(--amberdim);color:var(--amber);
  border-radius:20px;padding:5px 11px;font-family:var(--mono);font-size:12px}
.chip b{font-family:var(--disp);font-size:13px}
.secgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 12px;
  text-align:left;color:inherit;position:relative}
.sec .n{font-size:15px;font-weight:700;line-height:1.3}
.sec .h{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:5px}
.sec.own{border-color:var(--amberdim);background:linear-gradient(180deg,rgba(245,194,76,.07),var(--panel))}
.sec .dot{position:absolute;top:11px;right:11px;width:7px;height:7px;border-radius:50%;background:var(--amber)}

/* ── 종목 ── */
.back{background:none;border:none;color:var(--dim);font-size:14px;padding:6px 0;margin-bottom:6px}
.sechead{font-family:var(--disp);font-weight:900;font-size:22px;margin:0 0 12px}
.stk{background:var(--panel);border:1px solid var(--line);border-radius:11px;margin-bottom:8px;overflow:hidden}
.stk.own{border-color:var(--amberdim)}
.stk.flash{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
.stk.flash .stkhd .q.on{color:var(--ok)}
.stkhd{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:12px;
  padding:13px;width:100%;background:none;border:none;color:inherit;text-align:left}
.stkhd .L{font-family:var(--disp);font-weight:900;font-size:24px;color:var(--amber);text-align:center;line-height:1}
.stkhd .p{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.stkhd .q{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:3px}
.stkhd .q.on{color:var(--amber)}
.stkhd .r{text-align:right}
.pan{display:none;border-top:1px solid var(--line);padding:12px 13px}
.stk.open .pan{display:block}
.qbtns{display:flex;gap:6px;margin-bottom:9px}
.qbtns .btn{flex:1;padding:9px 0;font-size:12.5px}
.trade{display:flex;gap:8px;margin-top:9px}
.trade .btn{flex:1;padding:14px 0;font-size:15px;font-weight:700}
.buy{background:var(--up);border-color:var(--up);color:#fff}
.sell{background:var(--down);border-color:var(--down);color:#fff}
.note{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:9px;text-align:center}

/* ── OX ── */
.ox{text-align:center;padding:2vh 0}
.ansbig{font-family:var(--disp);font-weight:900;font-size:64px;color:var(--amber);line-height:1;margin-bottom:12px}
.res{font-size:20px;font-weight:700}
.res.good{color:var(--ok)} .res.bad{color:var(--up)}
.oxmsg{margin-top:18px;font-size:15px;color:var(--dim);font-weight:600}
.oxmsg.done{color:var(--ok)} .oxmsg.shut{color:var(--up)}
.ox .q{font-size:23px;font-weight:700;line-height:1.5;margin:6px 0 26px;text-wrap:balance}
.oxb{display:flex;gap:12px}
.oxb button{flex:1;aspect-ratio:1;border-radius:18px;border:2px solid var(--line);
  background:var(--panel);color:var(--ink);font-family:var(--disp);font-weight:900;font-size:64px}
.oxb button.sel{border-color:var(--amber);background:rgba(245,194,76,.16);color:var(--amber)}
.oxb button:disabled{opacity:.4}
.dead{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px 18px;text-align:center}
.dead .big{font-family:var(--disp);font-weight:900;font-size:30px;margin-bottom:8px}

/* ── 대기 ── */
.wait{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:30px 18px;text-align:center;color:var(--dim)}
.wait .ic{font-size:30px;margin-bottom:10px}
.wait .m{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:5px}
.wait .s{font-size:13.5px;line-height:1.6}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);
  margin-right:6px;animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.25}}

/* ── 보유 요약 ── */
.hold{margin-top:16px;border-top:1px solid var(--line);padding-top:13px}
.hold h3{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--faint);margin:0 0 9px;font-weight:600}
.hrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
  font-family:var(--mono);font-size:13px;padding:6px 0;border-bottom:1px solid rgba(42,52,65,.5)}
.hrow:last-child{border-bottom:none}
.hrow .s{font-family:var(--body);font-size:13.5px;color:var(--dim)}
.hrow .s b{color:var(--ink);font-weight:600}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;padding:12px 18px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:.22s;z-index:30;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:var(--up)} .toast.good{border-color:var(--amberdim);color:var(--amber)}
.conn{position:fixed;left:0;right:0;top:0;background:var(--up);color:#fff;text-align:center;
  font-size:12.5px;padding:6px;z-index:40;display:none}
.conn.on{display:block}
.foot{margin-top:26px;text-align:center;font-size:11.5px;color:var(--faint);line-height:1.7}
</style>
</head>
<body>
<div class="conn" id="conn">서버 연결이 끊겼습니다. 잠시만요…</div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const CFG={
  apiKey:"AIzaSyCCO6d0wnCr6Gwk036BxpLZx1MwPpZGyjQ",
  authDomain:"gunpo-invest.firebaseapp.com",
  databaseURL:"https://gunpo-invest-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"gunpo-invest",
  storageBucket:"gunpo-invest.firebasestorage.app",
  messagingSenderId:"1051198223428",
  appId:"1:1051198223428:web:ca527922d11cd8ee6e7811"
};
firebase.initializeApp(CFG);
const db=firebase.database();

const $=s=>document.querySelector(s);
const won=n=>Math.round(n||0).toLocaleString('ko-KR');
let uid=null, me=null, ST=null, openId=null, view='sectors', curSec=null;
let skew=0, flashId=null, flashT=null;
const now=()=>Date.now()+skew;

try{ uid=localStorage.getItem('gp_uid'); }catch(e){}
function newUid(){ const u='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  try{ localStorage.setItem('gp_uid',u); }catch(e){} return u; }

/* ── 연결 상태 ── */
db.ref('.info/connected').on('value',s=>$('#conn').classList.toggle('on', s.val()!==true));
db.ref('.info/serverTimeOffset').on('value',s=>{ skew=s.val()||0; });

/* ── 구독 ── */
db.ref('state').on('value',s=>{ ST=s.val(); render(); });
function watchMe(){
  if(!uid) return;
  db.ref('players/'+uid).on('value',s=>{ me=s.val(); render(); });
}
if(uid) watchMe();

/* ── 토스트 ── */
let tt=null;
function toast(m,k){ const e=$('#toast'); e.textContent=m; e.className='toast on '+(k||'');
  clearTimeout(tt); tt=setTimeout(()=>e.className='toast '+(k||''),2000); }

/* ── 계산 ── */
const P=()=> (ST&&ST.prices)||{};
const PREV=()=> (ST&&ST.prevPrices)||{};
const LABELS=()=> (ST&&ST.labels)||[];
function stockVal(){ const p=P(),q=(me&&me.qty)||{};
  return Object.keys(q).reduce((a,k)=>a+(q[k]||0)*(p[k]||0),0); }
function total(){ return ((me&&me.cash)||0)+stockVal(); }
function secList(){ const m={}; LABELS().forEach(s=>{ (m[s.sector]=m[s.sector]||[]).push(s); }); return m; }
function secChg(sec){ const p=P(),v=PREV(),L=secList()[sec]||[];
  const r=L.filter(s=>v[s.id]).map(s=>p[s.id]/v[s.id]-1);
  return r.length? r.reduce((a,b)=>a+b,0)/r.length : null; }
function ownedIn(sec){ const q=(me&&me.qty)||{};
  return (secList()[sec]||[]).some(s=>(q[s.id]||0)>0); }

/* ── 렌더 ── */
function render(){
  const app=$('#app');
  if(!ST){ app.innerHTML=`<div class="wait" style="margin-top:30vh"><div class="ic">⏳</div>
      <div class="m">연결 중입니다</div><div class="s">잠시만 기다려주세요</div></div>`; return; }
  if(!uid || !me){ return renderEnter(app); }
  if(me.rulesSeen!==true) return renderRules(app);
  app.innerHTML = header() + hintBox() + bodyHTML();
  bind();
}

function renderEnter(app){
  app.innerHTML=`<div class="enter">
    <div class="kick">GUNPO CENTER · 2005—2015</div>
    <h1>당신은 2005년의<br>투자자입니다</h1>
    <p>실명을 입력해주세요. 시상할 때 필요합니다.<br>
       한 사람이 한 대만 접속하세요.</p>
    <div class="field">
      <input type="text" id="nm" placeholder="이름" maxlength="10" autocomplete="off">
      <button class="btn pri" id="go">입장</button>
    </div>
    <div class="foot">시크릿 모드에서는 기록이 남지 않습니다</div>
  </div>`;
  const go=()=>{
    const v=$('#nm').value.trim();
    if(v.length<2){ toast('이름을 입력해주세요','bad'); return; }
    uid=uid||newUid();
    db.ref('players/'+uid).set({name:v, cash:(ST.seedCash||10000000), qty:{},
      joinedAt:firebase.database.ServerValue.TIMESTAMP, alive:true, rulesSeen:false})
      .then(watchMe).catch(()=>toast('입장 실패. 다시 눌러주세요','bad'));
  };
  $('#go').onclick=go;
  $('#nm').onkeydown=e=>{ if(e.key==='Enter') go(); };
  setTimeout(()=>$('#nm')&&$('#nm').focus(),200);
}

function renderRules(app){
  app.innerHTML=`<div class="rules" style="padding-top:2vh">
    <div class="kick">${me.name}님, 환영합니다</div>
    <h2 style="margin-top:10px">게임 규칙</h2>
    <div class="blk"><p><b>시드머니 1,000만 머니</b>로 시작합니다. 40개 종목이 전부 <b>10,000원</b>에서 출발해요.</p></div>
    <div class="blk"><p><b>회사 이름은 알려드리지 않습니다.</b> 아는 것은 업종뿐이에요.
      업종을 먼저 고르고, 그 안에서 A·B·C 중 하나를 고릅니다.</p></div>
    <div class="blk"><p><b>한 번 사면 1년을 들고 갑니다.</b> 중간에 못 팔아요. 다음 기회는 1년 뒤입니다.</p>
      <ul><li>수수료·세금 없음</li><li>한 종목에 전부 몰아넣어도 됨</li>
      <li>아무것도 안 사고 현금으로 버텨도 됨</li><li>매매 시간이 끝나면 잠깁니다</li></ul></div>
    <div class="blk"><p>매년 그 해에 <b>실제로 벌어진 일</b>이 공개되고 주가가 따라 움직입니다.
      10년 뒤 자산이 가장 큰 사람이 우승합니다.</p></div>
    <div class="blk"><p>이 화면에는 <b>내 자산만</b> 보입니다. 순위는 아무도 몰라요.</p></div>
    <button class="btn pri wide" id="ok" style="margin-top:16px">이해했습니다</button>
    <div class="foot">모든 주가는 2005~2015년 실제 한국 주식의 실제 기록입니다</div>
  </div>`;
  $('#ok').onclick=()=>db.ref('players/'+uid+'/rulesSeen').set(true);
}

function header(){
  const t=total(), m=t/(ST.seedCash||10000000);
  const label = ST.mode==='practice' ? '연습' : (ST.year||2005)+'년';
  return `<div class="hd">
    <div class="r1"><div class="nm">${esc(me.name)}</div>
      <div class="yr">${label}</div></div>
    <div class="assets">
      <div><span>현금</span><b>${won(me.cash)}</b></div>
      <div><span>주식</span><b>${won(stockVal())}</b></div>
      <div class="tot"><span>합계</span><b class="${m>1.0005?'up':m<0.9995?'down':''}">${won(t)}</b></div>
    </div></div>`;
}

function hintBox(){
  if(!me.hint) return '';
  return `<div class="hint"><div class="t">🔒 당신만 아는 정보</div>
    <div class="b">${esc(me.hint)}</div>
    <div class="s">이번 매매가 끝나면 사라집니다</div></div>`;
}

function bodyHTML(){
  const ph=ST.phase;
  if(ph==='ox') return oxHTML();
  if(ph==='trade') return tradeHTML();
  return waitHTML(ph);
}

function waitHTML(ph){
  const M={
    lobby:['⏳','곧 시작합니다','진행자 화면을 봐주세요'],
    news:['📰','그 해의 뉴스','화면을 봐주세요'],
    reveal:['📈','주가 공개','화면을 봐주세요'],
    hint:['🔒','힌트 배부 중','잠시만요'],
    final:['🏁','최종 결산','수고하셨습니다'],
    unmask:['🎭','종목 정체 공개','화면을 봐주세요'],
  }[ph]||['⏳','대기 중','진행자 화면을 봐주세요'];
  return `<div class="wait"><div class="ic">${M[0]}</div>
    <div class="m"><span class="pulse"></span>${M[1]}</div><div class="s">${M[2]}</div></div>`
    + holdHTML();
}

function holdHTML(){
  const q=(me.qty)||{}, p=P();
  const rows=LABELS().filter(s=>(q[s.id]||0)>0);
  if(!rows.length) return `<div class="hold"><h3>내 보유</h3>
    <div class="hrow"><span class="s">없음 — 전액 현금</span><span></span><span></span></div></div>`;
  return `<div class="hold"><h3>내 보유</h3>${rows.map(s=>`<div class="hrow">
    <span class="s">${esc(s.sector)} <b>${s.letter}</b></span>
    <span>${(q[s.id]).toLocaleString('ko-KR')}주</span>
    <span>${won((q[s.id])*(p[s.id]||0))}</span></div>`).join('')}</div>`;
}

/* ── 매매 ── */
function tradeHTML(){
  if(!ST.tradingOpen) return `<div class="wait"><div class="ic">🔒</div>
    <div class="m">매매가 마감됐습니다</div><div class="s">결과를 기다려주세요</div></div>`+holdHTML();
  const S=secList();
  if(view==='stocks' && curSec && S[curSec]) return stocksHTML(curSec, S[curSec]);
  return miniHold() + `<div class="secgrid">${Object.keys(S).map(sec=>{
    const c=secChg(sec), own=ownedIn(sec);
    const h = c===null? '&nbsp;' : `<span class="${c>0.0005?'up':c<-0.0005?'down':'flat'}">직전 ${c>0?'+':''}${(c*100).toFixed(0)}%</span>`;
    return `<button class="sec ${own?'own':''}" data-sec="${esc(sec)}">
      ${own?'<span class="dot"></span>':''}
      <div class="n">${esc(sec)}</div><div class="h">${h}</div></button>`;
  }).join('')}</div>`;
}

function miniHold(){
  const q=(me.qty)||{}, p=P();
  const rows=LABELS().filter(s=>(q[s.id]||0)>0);
  if(!rows.length) return `<div class="minih empty2">아직 아무것도 사지 않았습니다 — 전액 현금</div>`;
  return `<div class="minih">${rows.map(s=>`<span class="chip">${esc(s.sector)} <b>${s.letter}</b>
    ${(q[s.id]).toLocaleString('ko-KR')}주</span>`).join('')}</div>`;
}
function stocksHTML(sec,list){
  const p=P(), v=PREV(), q=(me.qty)||{}, cash=me.cash||0;
  return `<button class="back" id="back">← 업종 목록</button>
    <h2 class="sechead">${esc(sec)}</h2>
    ${list.map(s=>{
      const price=p[s.id]||0, have=q[s.id]||0, canBuy=price?Math.floor(cash/price):0;
      const base=v[s.id], c = base? price/base-1 : null;
      const cc = c===null?'flat':c>0.0005?'up':c<-0.0005?'down':'flat';
      return `<div class="stk ${openId===s.id?'open':''} ${have>0?'own':''} ${flashId===s.id?'flash':''}" data-card="${s.id}">
        <button class="stkhd" data-t="${s.id}">
          <span class="L">${s.letter}</span>
          <span><span class="p">${won(price)}</span>
            ${c===null?'':`<span class="q ${cc}">직전 ${c>0?'+':''}${(c*100).toFixed(0)}%</span>`}</span>
          <span class="r"><span class="q ${have>0?'on':''}">${have>0?have.toLocaleString('ko-KR')+'주':'보유 없음'}</span>
            ${have>0?`<span class="q">${won(have*price)}</span>`:''}</span>
        </button>
        <div class="pan">
          <div class="qbtns">
            <button class="btn" data-set="${s.id}:${Math.floor(canBuy*0.25)}">25%</button>
            <button class="btn" data-set="${s.id}:${Math.floor(canBuy*0.5)}">50%</button>
            <button class="btn" data-set="${s.id}:${canBuy}">최대</button>
            <button class="btn" data-set="${s.id}:${have}">보유</button>
          </div>
          <input type="tel" inputmode="numeric" data-qty="${s.id}" value="" placeholder="수량">
          <div class="trade">
            <button class="btn buy" data-buy="${s.id}">매수</button>
            <button class="btn sell" data-sell="${s.id}">매도</button>
          </div>
          <div class="note">현금으로 최대 ${won(canBuy)}주 · 보유 ${have.toLocaleString('ko-KR')}주</div>
        </div></div>`;
    }).join('')}`;
}

/* ── OX ── */
function oxHTML(){
  const ox=ST.ox||{};
  if(me.alive===false) return `<div class="dead"><div class="big">탈락</div>
    <div style="color:var(--dim);font-size:15px;line-height:1.6">자리에 앉아주세요.<br>다음 라운드에서 다시 만나요.</div></div>`;
  if(!ox.q) return `<div class="wait"><div class="ic">✋</div>
    <div class="m"><span class="pulse"></span>문제 준비 중</div>
    <div class="s">진행자가 문제를 열면 O · X 버튼이 나옵니다</div></div>`;
  const answered = me.oxIdx===ox.idx && me.oxA;
  if(ox.reveal){
    const right = answered && me.oxA===ox.answer;
    return `<div class="ox"><div class="q">${esc(ox.q)}</div>
      <div class="ansbig">정답 ${esc(ox.answer||'')}</div>
      <div class="res ${right?'good':'bad'}">${answered? (right?'맞혔습니다 🎉':'틀렸습니다') : '미제출'}</div></div>`;
  }
  const locked = answered || !ox.open;
  return `<div class="ox">
    <div class="q">${esc(ox.q)}</div>
    <div class="oxb">
      <button data-ox="O" class="${answered&&me.oxA==='O'?'sel':''}" ${locked?'disabled':''}>O</button>
      <button data-ox="X" class="${answered&&me.oxA==='X'?'sel':''}" ${locked?'disabled':''}>X</button>
    </div>
    <div class="oxmsg ${answered?'done':ox.open?'':'shut'}">
      ${answered? '✓ 제출했습니다 — '+esc(me.oxA) : ox.open? 'O 또는 X를 고르세요' : '마감되었습니다'}
    </div></div>`;
}

/* ── 이벤트 ── */
function bind(){
  const sec=document.querySelectorAll('[data-sec]');
  sec.forEach(b=>b.onclick=()=>{ curSec=b.dataset.sec; view='stocks'; openId=null; render(); });
  const bk=$('#back'); if(bk) bk.onclick=()=>{ view='sectors'; openId=null; render(); };
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
    openId = openId===b.dataset.t? null : b.dataset.t; render(); });
  document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{
    const i=b.dataset.set.lastIndexOf(':');
    const id=b.dataset.set.slice(0,i), v=b.dataset.set.slice(i+1);
    const el=document.querySelector(`[data-qty="${cssEsc(id)}"]`); if(el){ el.value=v; el.focus(); } });
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>trade(b.dataset.buy,1));
  document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>trade(b.dataset.sell,-1));
  document.querySelectorAll('[data-ox]').forEach(b=>b.onclick=()=>submitOx(b.dataset.ox));
}
function submitOx(a){
  const ox=ST.ox||{};
  if(ox.reveal || !ox.open){ toast('마감되었습니다','bad'); return; }
  db.ref('players/'+uid).update({oxA:a, oxIdx:ox.idx, oxT:firebase.database.ServerValue.TIMESTAMP});
}
function trade(id,dir){
  if(!ST.tradingOpen){ toast('매매가 마감됐습니다','bad'); return; }
  const el=document.querySelector(`[data-qty="${cssEsc(id)}"]`);
  const n=parseInt(el&&el.value,10);
  if(!Number.isFinite(n)||n<=0){ toast('수량을 입력하세요','bad'); return; }
  const price=P()[id]; if(!price){ toast('시세를 불러오는 중입니다','bad'); return; }
  const ref=db.ref('players/'+uid);
  ref.transaction(cur=>{
    if(!cur) return cur;
    cur.qty=cur.qty||{};
    const have=cur.qty[id]||0;
    if(dir>0){ const cost=n*price; if(cost>cur.cash) return; cur.cash-=cost; cur.qty[id]=have+n; }
    else { if(n>have) return; cur.cash+=n*price; cur.qty[id]=have-n; if(!cur.qty[id]) delete cur.qty[id]; }
    return cur;
  }).then(r=>{
    if(!r.committed){ toast(dir>0?'현금이 부족합니다':'보유 수량이 부족합니다','bad'); return; }
    if(el) el.value='';
    openId=null; flashId=id;
    clearTimeout(flashT); flashT=setTimeout(()=>{ flashId=null; render(); },1600);
    toast(`✓ ${dir>0?'매수':'매도'} 완료 — ${n.toLocaleString('ko-KR')}주 · ${won(n*price)}`,'good');
    render();
  }).catch(()=>toast('처리 실패. 다시 시도해주세요','bad'));
}

/* ── 유틸 ── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cssEsc(s){ return String(s).replace(/["\\]/g,'\\$&'); }
render();
</script>

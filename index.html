<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<meta name="robots" content="noindex">
<title>군포센터 트레이딩 데스크</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@700;900&family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#0E1116; --panel:#161C24; --panel-2:#1D242E; --line:#2A3441;
  --ink:#E9EDF2; --ink-dim:#93A0B1; --ink-faint:#5D6B7C;
  --up:#F04452; --down:#3182F6; --flat:#8B95A5;
  --amber:#F5C24C; --amber-dim:#8A6E24;
  --disp:"Gothic A1","Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono","IBM Plex Sans KR",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font-family:var(--body);cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 90px}

/* setup */
.setup{padding-top:8vh}
.setup .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber)}
.setup h1{font-family:var(--disp);font-weight:900;font-size:clamp(34px,10vw,52px);line-height:1.05;margin:8px 0 12px;text-wrap:balance}
.setup p{color:var(--ink-dim);line-height:1.65;font-size:15px;margin:0 0 20px}
.field{display:flex;gap:8px}
input[type=text],input[type=number],input[type=tel]{flex:1;min-width:0;background:var(--panel-2);
  border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:13px 14px;
  font-family:var(--body);font-size:16px}
input[type=number],input[type=tel]{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;
  padding:12px 16px;font-size:15px;font-weight:600;transition:background .15s}
.btn:active{background:#2b3542}
.btn.primary{background:var(--amber);color:#171208;border-color:var(--amber);font-weight:700}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.32;cursor:not-allowed}

/* header */
.hd{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--ground) 76%,transparent);
  padding:10px 0 12px;margin-bottom:6px}
.hd-top{display:flex;align-items:baseline;gap:9px;margin-bottom:8px}
.hd-top .team{font-family:var(--disp);font-weight:900;font-size:19px;color:var(--amber);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd-top .yr{font-family:var(--mono);font-size:12px;color:var(--ink-faint);letter-spacing:.1em;margin-left:auto;flex:none}
.total{display:flex;align-items:flex-end;gap:12px}
.total .v{font-family:var(--mono);font-size:33px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.total .m{font-family:var(--mono);font-size:16px;font-weight:700;padding-bottom:2px}
.cashline{display:flex;gap:14px;margin-top:9px;font-family:var(--mono);font-size:12.5px;color:var(--ink-dim);
  font-variant-numeric:tabular-nums;flex-wrap:wrap}
.cashline b{color:var(--ink);font-weight:600}

/* list */
.list{display:flex;flex-direction:column;gap:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card.open{border-color:var(--amber-dim)}
.card.held{background:linear-gradient(90deg,rgba(245,194,76,.055),var(--panel) 55%)}
.chead{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:11px;padding:11px 13px;width:100%;
  background:none;border:none;color:inherit;text-align:left}
.chead .c{font-family:var(--disp);font-weight:900;font-size:23px;color:var(--amber);line-height:1;text-align:center}
.chead .s{font-size:14.5px;font-weight:600;line-height:1.25}
.chead .s em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-faint);font-weight:400;margin-top:2px}
.chead .r{text-align:right}
.chead .p{display:block;font-family:var(--mono);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.chead .q{display:block;font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);margin-top:3px;font-variant-numeric:tabular-nums}
.chead .q.on{color:var(--amber)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}

.panel{display:none;padding:0 13px 13px;border-top:1px solid var(--line)}
.card.open .panel{display:block}
.qrow{display:flex;gap:7px;margin:11px 0}
.qrow .btn{flex:1;padding:9px 0;font-size:13px}
.amt{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.amt label{font-size:12px;color:var(--ink-faint);font-family:var(--mono);letter-spacing:.08em}
.trade{display:flex;gap:8px}
.trade .btn{flex:1;padding:13px 0;font-size:15px;font-weight:700}
.buy{background:var(--up);border-color:var(--up);color:#fff}
.sell{background:var(--down);border-color:var(--down);color:#fff}
.note{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);margin-top:9px;text-align:center}

/* unlock bar */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:9}
.dock .inner{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:center}
.dock input{flex:1;text-align:center;letter-spacing:.35em;font-size:19px;font-weight:700;padding:11px}
.dock .btn{flex:none}

.toast{position:fixed;left:50%;bottom:78px;transform:translate(-50%,14px);background:var(--panel-2);
  border:1px solid var(--line);border-radius:9px;padding:11px 17px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:var(--up);color:#ffc9ce}
.toast.good{border-color:var(--amber-dim);color:var(--amber)}

/* history */
.hist{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.hist h2{font-family:var(--disp);font-size:17px;font-weight:700;margin:0 0 10px;color:var(--ink-dim)}
.hgrid{display:flex;flex-direction:column;gap:4px}
.h{display:grid;grid-template-columns:52px 1fr 92px;align-items:center;gap:10px;font-family:var(--mono);
  font-size:13px;font-variant-numeric:tabular-nums;padding:5px 2px}
.h .y{color:var(--ink-faint)}
.h .bw{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.h .bf{height:100%;background:var(--amber-dim)}
.h .vv{text-align:right;font-weight:600}
.foot{font-size:12px;color:var(--ink-faint);line-height:1.6;margin-top:20px;text-align:center}
.reset{background:none;border:none;color:var(--ink-faint);font-size:12px;text-decoration:underline;padding:4px}
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const STOCKS=[{"c": "A", "sector": "전자·반도체", "note": "국내 최대 전자 기업 · 반도체와 휴대폰"}, {"c": "B", "sector": "전력·인프라", "note": "전국에 전기를 공급하는 공기업"}, {"c": "C", "sector": "조선·중공업", "note": "세계 최대급 조선소 · 선박 수주가 곧 실적"}, {"c": "D", "sector": "화학·소재", "note": "산업용 화학 소재 · 태양광 원료로 사업 확장"}, {"c": "E", "sector": "자동차", "note": "국내 2위 완성차 · 수출 비중이 높음"}, {"c": "F", "sector": "화학·배터리", "note": "종합 화학 기업 · 2차전지 신사업 진출"}, {"c": "G", "sector": "인터넷·플랫폼", "note": "국내 1위 검색 포털"}, {"c": "H", "sector": "호텔·면세점", "note": "호텔과 면세점 운영 · 관광객 수에 민감"}, {"c": "I", "sector": "해운·물류", "note": "컨테이너 해운 · 운임과 유가에 좌우"}, {"c": "J", "sector": "조선·해양플랜트", "note": "대형 조선 · 해양플랜트 수주 비중이 큼"}];
const ENC={"2006": "+PnNDTLxV0fIV3JfHQaB6P9IKJtwsqOd9cti5YbA2Oiy+hPcnle0oB3JNweMAyLbzjNAfB60KRGJp2c=", "2007": "lYTcWvMA+ooOp6cSZKfkKvyd/jLuYRjqmuwOqdMAeMmrBJubBDhtvHj+uDRPSuEyGx8HTIlg4VOKlUU=", "2008": "dTXRXlPRBGphQmWJo40aLFH4b0/SYCrpVdkUI6yAqErt5whNzyyyFa253R2Mg5K1yYQPlLzDNubB7Q==", "2009": "Y7Ilqxp0DAn3zkH4NeqPwUZqp3IsJZ88NK9nws+vvtg48vmWWboaL9Q3W3TRc72LQDy8JdrtPDpvHuo=", "2010": "ZT5uBp20axVgXgvgSDkkgpK/ef0eV/eRGczn9IxDGB0Ot2BS0NIgaWptODApLmGm2AQPMwwU/nJKE3dJEM0=", "2011": "ltKO7roP89uZRSmAUbP/doec7qzpBo/I1RHKguPtOEkkXbPjCLx6nYQLWAbt7Jm0LtHJJ0sKS0kN31WUNA==", "2012": "78EdwvTpvDtpQ0Y42mopONHzp8lthnnL1E2jmbppE4igIEYvWoGmHauCM98AZCBiS/R7pJIAE0s/BDdhuw==", "2013": "WvK7MHTYNU0JtWJcKLvxe8o5mTW5no07k6xAzxdxgFLgZarc9kBGOaVeTxNWYCoepJT+Em4usAD//YQNIg==", "2014": "uZaeYmsu2bn/HpthtyFmR+PFYB4gQOY/zToarsvLg9QeXdpJIkPKsTDKwmlFFw/R69Ef1IaypcydI1Gq", "2015": "Yt4BYsNxw6rcTd6tevbbtsBKstYPqoNsTGL8PCxj/vRE5XDTbmyhJ9luJpLaVuv9xHtWQrHTCCeQrW3v"};
const START_YEAR=2005;

const SEED_CASH = 10000000, START_PRICE = 10000;
const $ = s => document.querySelector(s);
const won = n => Math.round(n).toLocaleString('ko-KR');

/* ---------- state ---------- */
let S = { team:'', cash:SEED_CASH, qty:new Array(STOCKS.length).fill(0),
          prices:new Array(STOCKS.length).fill(START_PRICE), year:START_YEAR,
          hist:[{y:START_YEAR,v:SEED_CASH}], open:-1 };
function save(){ try{ localStorage.setItem('rid_team_v1', JSON.stringify({...S,open:-1})); }catch(e){} }
function load(){ try{ const r=localStorage.getItem('rid_team_v1'); if(r){ S={...S,...JSON.parse(r)}; } }catch(e){} }
load();

/* ---------- unlock ---------- */
function keystream(code,n){
  let s=0n; for(const ch of code) s=(s*31n+BigInt(ch.charCodeAt(0))) & 0x7fffffffn;
  const out=[];
  for(let i=0;i<n;i++){ s=(s*1103515245n+12345n) & 0x7fffffffn; out.push(Number((s>>16n)&0xffn)); }
  return out;
}
function tryUnlock(code){
  code = String(code||'').trim();
  if(!code) return null;
  for(const y of Object.keys(ENC)){
    const bin = atob(ENC[y]);
    const k = keystream(code, bin.length);
    let txt=''; for(let i=0;i<bin.length;i++) txt += String.fromCharCode(bin.charCodeAt(i)^k[i]);
    if(txt.startsWith('OK|')){
      const nums = txt.slice(3).split(',').map(Number);
      if(nums.length===STOCKS.length && nums.every(n=>Number.isFinite(n))) return {year:+y, prices:nums};
    }
  }
  return null;
}

/* ---------- calc ---------- */
const holdVal = () => S.qty.reduce((a,q,i)=>a+q*S.prices[i],0);
const total = () => S.cash + holdVal();

/* ---------- toast ---------- */
let tt=null;
function toast(msg,kind){
  const el=$('#toast'); el.textContent=msg; el.className='toast on '+(kind||'');
  clearTimeout(tt); tt=setTimeout(()=>el.className='toast '+(kind||''),1900);
}

/* ---------- render ---------- */
function render(){
  const app=$('#app');
  if(!S.team){
    app.innerHTML = `<div class="setup">
      <div class="kicker">GUNPO CENTER INVESTMENT CUP · 2005—2015</div>
      <h1>팀 이름을<br>정해주세요</h1>
      <p>이 화면이 여러분 팀의 계좌입니다. 시드머니는 <strong style="color:var(--ink)">1,000만 머니</strong>,
      모든 종목의 시작가는 10,000원입니다. 한 팀에 폰 한 대만 쓰세요 — 창을 닫아도 기록은 남습니다.</p>
      <div class="field">
        <input type="text" id="tn" placeholder="예: 3조 불나방" maxlength="14" autocomplete="off">
        <button class="btn primary" id="tgo">시작</button>
      </div></div>`;
    $('#tgo').onclick=()=>{ const v=$('#tn').value.trim(); if(!v){ toast('팀 이름을 입력하세요','bad'); return; }
      S.team=v; save(); render(); };
    $('#tn').onkeydown=e=>{ if(e.key==='Enter') $('#tgo').click(); };
    return;
  }

  const tv=total(), mul=tv/SEED_CASH;
  const maxH=Math.max(...S.hist.map(h=>h.v), SEED_CASH);

  app.innerHTML = `
   <div class="hd">
     <div class="hd-top"><div class="team">${S.team}</div><div class="yr">${S.year}년 12월</div></div>
     <div class="total"><div class="v">${won(tv)}</div>
       <div class="m ${mul>1.0005?'up':mul<0.9995?'down':'flat'}">${mul.toFixed(2)}배</div></div>
     <div class="cashline"><span>현금 <b>${won(S.cash)}</b></span><span>주식 <b>${won(holdVal())}</b></span></div>
   </div>

   <div class="list">${STOCKS.map((s,i)=>{
      const q=S.qty[i], p=S.prices[i], val=q*p;
      const canBuy=Math.floor(S.cash/p);
      return `<div class="card ${S.open===i?'open':''} ${q>0?'held':''}" data-card="${i}">
        <button class="chead" data-t="${i}" aria-expanded="${S.open===i}">
          <span class="c">${s.c}</span>
          <span class="s">${s.sector}<em>${s.note}</em></span>
          <span class="r"><span class="p">${won(p)}</span>
            <span class="q ${q>0?'on':''}">${q>0?q+'주 · '+won(val):'보유 없음'}</span></span>
        </button>
        <div class="panel">
          <div class="qrow">
            <button class="btn" data-set="${i}:${Math.floor(canBuy*0.25)}">25%</button>
            <button class="btn" data-set="${i}:${Math.floor(canBuy*0.5)}">50%</button>
            <button class="btn" data-set="${i}:${canBuy}">최대</button>
            <button class="btn" data-set="${i}:${q}">보유수량</button>
          </div>
          <div class="amt"><label for="n${i}">수량</label>
            <input type="tel" inputmode="numeric" id="n${i}" value="0" data-qty="${i}"></div>
          <div class="trade">
            <button class="btn buy" data-buy="${i}">매수</button>
            <button class="btn sell" data-sell="${i}">매도</button>
          </div>
          <div class="note">현금으로 최대 ${won(canBuy)}주 · 보유 ${q}주</div>
        </div></div>`;
    }).join('')}</div>

   <div class="hist"><h2>연도별 총자산</h2><div class="hgrid">${
     S.hist.map(h=>`<div class="h"><span class="y">${h.y}</span>
       <span class="bw"><span class="bf" style="width:${Math.max(2,h.v/maxH*100).toFixed(1)}%"></span></span>
       <span class="vv ${h.v>=SEED_CASH?'up':'down'}">${won(h.v)}</span></div>`).join('')
   }</div></div>

   <p class="foot">해금 코드는 진행자 화면에만 나옵니다. 정직하게 갑시다.<br>
     <button class="reset" id="rst">계좌 초기화</button></p>

   <div class="dock"><div class="inner">
     <input type="tel" inputmode="numeric" id="code" placeholder="해금 코드" maxlength="6" autocomplete="off">
     <button class="btn primary" id="unlock">정산</button>
   </div></div>`;

  bind();
}

function bind(){
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.t; S.open = (S.open===i?-1:i); render();
    if(S.open===i) document.querySelector(`[data-card="${i}"]`).scrollIntoView({block:'nearest',behavior:'smooth'});
  });
  document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{
    const [i,v]=b.dataset.set.split(':'); const inp=document.querySelector(`[data-qty="${i}"]`);
    inp.value=v; inp.focus();
  });
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>trade(+b.dataset.buy,1));
  document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>trade(+b.dataset.sell,-1));
  $('#unlock').onclick=doUnlock;
  $('#code').onkeydown=e=>{ if(e.key==='Enter') doUnlock(); };
  $('#rst').onclick=()=>{ if(confirm('계좌를 처음 상태로 되돌립니다. 진행 중이라면 되돌릴 수 없어요.')){
    try{ localStorage.removeItem('rid_team_v1'); }catch(e){}
    S={team:'',cash:SEED_CASH,qty:new Array(STOCKS.length).fill(0),
       prices:new Array(STOCKS.length).fill(START_PRICE),year:START_YEAR,
       hist:[{y:START_YEAR,v:SEED_CASH}],open:-1}; render(); } };
}

function trade(i,dir){
  const n=parseInt(document.querySelector(`[data-qty="${i}"]`).value,10);
  if(!Number.isFinite(n)||n<=0){ toast('수량을 입력하세요','bad'); return; }
  const p=S.prices[i], code=STOCKS[i].c;
  if(dir>0){
    const cost=n*p;
    if(cost>S.cash){ toast(`현금이 ${won(cost-S.cash)} 부족합니다`,'bad'); return; }
    S.cash-=cost; S.qty[i]+=n; toast(`${code} ${n}주 매수 · ${won(cost)}`,'good');
  } else {
    if(n>S.qty[i]){ toast(`${code}는 ${S.qty[i]}주만 보유 중입니다`,'bad'); return; }
    S.cash+=n*p; S.qty[i]-=n; toast(`${code} ${n}주 매도 · ${won(n*p)}`,'good');
  }
  save(); render();
}

function doUnlock(){
  const raw=$('#code').value;
  const r=tryUnlock(raw);
  if(!r){ toast('코드가 맞지 않습니다','bad'); return; }
  if(r.year<=S.year){ toast(`${r.year}년은 이미 정산했습니다`,'bad'); return; }
  const before=total();
  S.prices=r.prices; S.year=r.year;
  const after=total();
  S.hist.push({y:r.year,v:after});
  S.open=-1; save(); render();
  const d=after-before, pct=before?((after/before-1)*100):0;
  toast(`${r.year}년 정산 · ${d>=0?'+':''}${won(d)} (${pct>=0?'+':''}${pct.toFixed(1)}%)`, d>=0?'good':'bad');
}

render();
</script>

</body>
</html>
